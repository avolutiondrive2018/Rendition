<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendition 3D Compositor</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <h1 class="logo">Rendition</h1>
            <p class="subtitle">3D Scene Compositor</p>

            <div class="control-group">
                <label class="control-label">Background Image</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="imageUpload" accept="image/*" />
                    <button class="btn btn-primary" onclick="document.getElementById('imageUpload').click()">Upload
                        Image</button>
                    <p id="uploadStatus" class="status-text">No image selected</p>
                </div>
            </div>

            <div class="control-group" id="modelsBox" style="display: none;">
                <label class="control-label">Add 3D Models</label>
                <div class="models-grid">
                    <button class="btn-model" data-model="https://modelviewer.dev/shared-assets/models/Astronaut.glb">
                        <img src="https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/Astronaut.png"
                            alt="Astronaut"
                            onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiM0NCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmaWxsPSJ3aGl0ZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QXN0cm9uYXV0PC90ZXh0Pjwvc3ZnPg=='" />
                        <span>Astronaut</span>
                    </button>
                    <button class="btn-model"
                        data-model="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb">
                        <img src="https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/RobotExpressive.png"
                            alt="Robot"
                            onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiM0NCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmaWxsPSJ3aGl0ZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Um9ib3Q8L3RleHQ+PC9zdmc+'" />
                        <span>Robot</span>
                    </button>
                    <button class="btn-model" data-model="models/led-display.glb">
                        <img src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/screenshot/screenshot.png"
                            alt="Duck"
                            onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiM0NCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmaWxsPSJ3aGl0ZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+RHVjazwvdGV4dD48L3N2Zz4='" />
                        <span>Duck</span>
                    </button>
                </div>
            </div>

            <div class="control-group action-group" id="actionsBox" style="display: none;">
                <button class="btn btn-success" id="btnSaveImage">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Capture & Save
                </button>
            </div>
        </aside>

        <!-- Main Canvas Area -->
        <main class="workspace">
            <div id="dropzone" class="dropzone empty">
                <div class="dropzone-message">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)"
                        stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <h2>Upload an image to start</h2>
                    <p>Supported formats: JPG, PNG, WebP</p>
                </div>
                <!-- Canvas becomes populated once image is uploaded -->
                <div id="canvas" class="canvas-hidden">
                    <img id="bgImg" src="" alt="Background" draggable="false" />
                    <!-- Model wrappers injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
