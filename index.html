        <!-- Main Canvas Area -->
        <main class="workspace">
            <div id="dropzone" class="dropzone empty">
                <div class="dropzone-message">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)"
                        stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <h2>Upload an image to start</h2>
                    <p>Supported formats: JPG, PNG, WebP</p>
                </div>
                <!-- Canvas becomes populated once image is uploaded -->
                <div id="canvas" class="canvas-hidden">
                    <img id="bgImg" src="" alt="Background" draggable="false" />
                    <!-- Model wrappers injected here -->
                </div>
            </div>
        </main>
